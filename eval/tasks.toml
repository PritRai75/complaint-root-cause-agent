# Eval tasks for the agent, written by Prit. Graded by eval/harness.py.
#
#   python -m eval.harness check     checks this file and prints every reference
#
# Bump version when a task changes after it has been run.
#
# Splits (decision 31): the 12 report + 3 clarify tasks are split = "test",
# run once with --final after the planner prompt is frozen. Tasks for tuning
# are split = "dev" and are not counted. Never reuse a test question, or a
# reworded one, as a dev task.
#
# Fields of one [[task]]:
#   id            a capital letter and two digits, unique (suggested: D01.. dev,
#                 N01..N12 test report, A01..A03 test clarify)
#   split         "dev" or "test"
#   kind          "report"  the agent should build and send a report
#                 "clarify" the agent should ask a clarifying question and send nothing
#   question      exactly what is sent to the agent (at most 1,000 characters)
#   figures       report tasks: reference SQL on the agent's tables (complaints_v,
#                 responses_v, narratives_v; text_has() works). At most 12 rows.
#                 Every cell is a key figure that must be written in the findings
#                 (decision 32), except columns whose name starts with "_" (shown,
#                 not graded). Numbers match with the number check's rounding;
#                 text matches as whole words, case ignored ("YYYY-MM" also
#                 matches the month's name). Leave out a text column unless the
#                 findings must name it in those words.
#                 A list of SQL strings gives accepted alternatives: the task
#                 passes if one of them is found in full (use it for a second
#                 reading you accept, or for ties at a top-N cut).
#   direction     optional, "up" or "down", with
#   direction_of  the figures column holding the signed change (positive = up);
#                 the finding that gives it must say it moved that way (decision 33)
#   population    root-cause tasks: SQL returning complaint_id for the narratives
#                 the agent should tag. The agent's tag set must draw exactly the
#                 same narratives (decision 34). Goes with
#   causes        1 to 3: the shares of the top N root causes must be in the findings
#   note          optional: why the reference is written this way
#
# A report task needs figures, population or both. A clarify task has only
# id, split, kind, question and note.
#
# Format of one task (multi-line strings use triple quotes):
#
# [[task]]
# id = "D01"
# split = "dev"
# kind = "report"
# question = """..."""
# figures = """SELECT ..."""
# note = """..."""

version = "tasks-1"

# ---------- dev tasks (written by Claude at Prit's request, session 8; not counted) ----------

[[task]]
id = "D01"
split = "dev"
kind = "report"
question = """How many credit card complaints did the CFPB receive in March 2026?"""
figures = """SELECT COUNT(*) AS complaints FROM complaints_v
WHERE product = 'Credit card' AND month = '2026-03'"""
note = """Volume: one product, one month, one number."""

[[task]]
id = "D02"
split = "dev"
kind = "report"
question = """What was the timely response rate for checking or savings account complaints received from January to June 2026?"""
figures = """SELECT 100.0 * SUM(timely) / COUNT(*) AS timely_rate FROM responses_v
WHERE product = 'Checking or savings account'"""
note = """Rate: the defined timely_response_rate (final responses only, Jan to Jun), not rounded."""

[[task]]
id = "D03"
split = "dev"
kind = "report"
question = """Did the number of credit card complaints rise or fall from January 2026 to June 2026, and by how many complaints?"""
figures = """SELECT jan, jun, jun - jan AS change FROM (
  SELECT SUM(month = '2026-01') AS jan, SUM(month = '2026-06') AS jun
  FROM complaints_v WHERE product = 'Credit card')"""
direction = "down"
direction_of = "change"
note = """Change in count between two months. Direction written before seeing the data: check refuses it if the data says otherwise, and then it is flipped to match."""

[[task]]
id = "D04"
split = "dev"
kind = "report"
question = """How many checking or savings account complaints received from January to July 2026 have a published narrative that mentions Zelle?"""
figures = """SELECT COUNT(*) AS mentions FROM narratives_v
WHERE product = 'Checking or savings account' AND text_has(complaint_id, 'zelle') = 1"""
note = """Word filter on narratives (window Jan to Jul)."""

[[task]]
id = "D05"
split = "dev"
kind = "report"
question = """What were the three most common root causes in credit card complaints received from January to June 2026, and what share of the tagged narratives did each one account for?"""
population = """SELECT complaint_id FROM narratives_v
WHERE product = 'Credit card' AND month BETWEEN '2026-01' AND '2026-06'"""
causes = 3
note = """Root cause: same population as the S6 real run (card, Jan to Jun), so the tags are probably cached."""

[[task]]
id = "D06"
split = "dev"
kind = "clarify"
question = """How did the number of checking account complaints in 2026 compare with 2025?"""
note = """Data not here: the snapshot covers 2026 only, so the agent should ask instead of building a report."""
