# Semantic layer: the only tables the agent can query, and the defined metrics.
#
# python -m agent.semantic build turns each [[table]] into a real table in
# data/agent.sqlite, built from data/complaints.sqlite. The agent's database
# holds these tables and nothing else, so a rule written into a table (which
# rows it keeps, which columns it leaves out) holds whatever SQL the agent
# writes. A table with hidden = true goes into data/agent_text.sqlite instead,
# a file the agent's connection never opens. Change this file, then bump
# version and rebuild; the agent refuses a database built from a different
# version of this file.
#
# layer-2 (session 5): narrative text moved from narratives_v to the hidden
# table narrative_text, in its own file, so the planning model never sees
# consumer text. The agent filters by words with text_has(complaint_id,
# phrase) instead.

version = "layer-2"
written = "2026-11-10"
data_note = """CFPB Consumer Complaint Database, narratives archive files 15 to 21. \
Credit card and Checking or savings account complaints received 1 Jan to 31 Aug 2026. \
Narratives are published only for complaints submitted on the web with the consumer's consent, \
and the archive stops on 14 Aug 2026."""

# Date windows on date_received, inclusive.
[window.all]
from = "2026-01-01"
to = "2026-08-31"
why = "The whole snapshot."

[window.response_final]
from = "2026-01-01"
to = "2026-06-30"
why = """Company responses to complaints received in July and August were not final when the \
archive was taken (9.9% and 36.6% still in progress), so response-based rates use January to June."""

[window.narratives]
from = "2026-01-01"
to = "2026-07-31"
why = """No narrative is published for complaints received in August 2026. July coverage is \
low (24.1% against 28 to 46% earlier), probably because publication stopped on 14 Aug, \
before many July narratives would have been published."""

[[table]]
name = "complaints_v"
window = "all"
from = "complaints"
where = ""
rows = "One row per complaint received January to August 2026. Use it for volumes and shares."
leaves_out = """Company response fields, which are not final for July and August. \
Use responses_v for timely response and relief."""

[[table.column]]
name = "complaint_id"
description = "CFPB complaint ID. Unique."

[[table.column]]
name = "date_received"
description = "Date the CFPB received the complaint, YYYY-MM-DD."

[[table.column]]
name = "month"
sql = "substr(date_received, 1, 7)"
description = "Month received, YYYY-MM."

[[table.column]]
name = "product"
description = "'Credit card' or 'Checking or savings account'."

[[table.column]]
name = "sub_product"
description = "Sub-product the consumer chose."

[[table.column]]
name = "issue"
description = "Issue the consumer chose from the CFPB's list. Not a root cause."

[[table.column]]
name = "sub_issue"
description = "Sub-issue the consumer chose. Often blank."

[[table.column]]
name = "company"
description = "Company the complaint is about."

[[table.column]]
name = "state"
description = "Consumer's US state or territory code. Can be blank."

[[table.column]]
name = "tags"
description = "'Older American', 'Servicemember', both, or blank."

[[table.column]]
name = "submitted_via"
description = "Channel: Web, Referral, Phone, Postal mail and others. Only Web complaints carry narratives."

[[table.column]]
name = "has_narrative"
description = "1 if a narrative was published for this complaint, else 0."

[[table]]
name = "responses_v"
window = "response_final"
from = "complaints"
where = "company_response <> 'In progress'"
rows = """One row per complaint received January to June 2026 with a final company response \
(complaints still in progress are left out). Use it for timely response and relief."""
leaves_out = "Complaints received in July and August, and the 163 still in progress."

[[table.column]]
name = "complaint_id"
description = "CFPB complaint ID. Joins to complaints_v and narratives_v."

[[table.column]]
name = "month"
sql = "substr(date_received, 1, 7)"
description = "Month received, YYYY-MM."

[[table.column]]
name = "product"
description = "'Credit card' or 'Checking or savings account'."

[[table.column]]
name = "issue"
description = "Issue the consumer chose."

[[table.column]]
name = "sub_issue"
description = "Sub-issue the consumer chose. Often blank."

[[table.column]]
name = "company"
description = "Company the complaint is about."

[[table.column]]
name = "company_response"
description = """'Closed with explanation', 'Closed with monetary relief', \
'Closed with non-monetary relief' or 'Untimely response'."""

[[table.column]]
name = "timely_response"
description = "'Yes' or 'No', as reported by the CFPB."

[[table.column]]
name = "timely"
sql = "CASE WHEN timely_response = 'Yes' THEN 1 ELSE 0 END"
description = "1 if the company responded on time, else 0."

[[table.column]]
name = "closed"
sql = "CASE WHEN company_response LIKE 'Closed%' THEN 1 ELSE 0 END"
description = "1 if the company closed the complaint (any 'Closed ...' response), else 0."

[[table.column]]
name = "relief"
sql = """CASE WHEN company_response IN ('Closed with monetary relief', \
'Closed with non-monetary relief') THEN 1 ELSE 0 END"""
description = "1 if closed with monetary or non-monetary relief, else 0."

[[table.column]]
name = "monetary_relief"
sql = "CASE WHEN company_response = 'Closed with monetary relief' THEN 1 ELSE 0 END"
description = "1 if closed with monetary relief, else 0."

[[table]]
name = "narratives_v"
window = "narratives"
from = "narratives JOIN complaints USING (complaint_id)"
where = ""
rows = """One row per published narrative, complaints received January to July 2026. \
The join to complaints is already made here."""
leaves_out = """The narrative text itself, which the agent never sees: filter by words with \
text_has(complaint_id, 'phrase'). Company response fields, as in complaints_v."""

[[table.column]]
name = "complaint_id"
description = "CFPB complaint ID. Joins to complaints_v and responses_v."

[[table.column]]
name = "month"
sql = "substr(date_received, 1, 7)"
description = "Month received, YYYY-MM."

[[table.column]]
name = "product"
description = "'Credit card' or 'Checking or savings account'."

[[table.column]]
name = "issue"
description = "Issue the consumer chose."

[[table.column]]
name = "sub_issue"
description = "Sub-issue the consumer chose. Often blank."

[[table.column]]
name = "company"
description = "Company the complaint is about."

[[table.column]]
name = "char_length"
description = "Length of the narrative in characters."

[[table]]
name = "narrative_text"
hidden = true
window = "narratives"
from = "narratives JOIN complaints USING (complaint_id)"
where = ""
rows = "One row per published narrative, January to July 2026: the text, for code only."
leaves_out = "Everything but the ID and the text."

[[table.column]]
name = "complaint_id"
description = "CFPB complaint ID."

[[table.column]]
name = "narrative"
description = """The consumer's own account, exactly as published. Personal details are redacted \
as XXXX and dollar amounts are rounded by the CFPB, so amounts are approximate. Unverified and \
one-sided. Some are stored as a bytes literal b'...'; agent/text.py readable() decodes them."""

# Metrics. kind is "count" (rows), "share" (rows in a group out of all rows that
# match the filters) or "rate" (numerator over denominator, as a percentage).
# where narrows the metric's own rows on top of the table's window.

[[metric]]
name = "complaint_volume"
table = "complaints_v"
kind = "count"
description = "Number of complaints."

[[metric]]
name = "complaint_share"
table = "complaints_v"
kind = "share"
description = "Share of complaints in each group, out of all complaints matching the filters."

[[metric]]
name = "timely_response_rate"
table = "responses_v"
kind = "rate"
numerator = "SUM(timely)"
denominator = "COUNT(*)"
description = "Complaints the company responded to on time, out of complaints with a final response."

[[metric]]
name = "relief_rate"
table = "responses_v"
kind = "rate"
numerator = "SUM(relief)"
denominator = "SUM(closed)"
description = "Complaints closed with monetary or non-monetary relief, out of closed complaints."

[[metric]]
name = "monetary_relief_rate"
table = "responses_v"
kind = "rate"
numerator = "SUM(monetary_relief)"
denominator = "SUM(closed)"
description = "Complaints closed with monetary relief, out of closed complaints."

[[metric]]
name = "narrative_coverage"
table = "complaints_v"
kind = "rate"
numerator = "SUM(has_narrative)"
denominator = "COUNT(*)"
where = "month <= '2026-07'"
description = """Complaints with a published narrative, out of all complaints, January to July. \
Root-cause shares describe this subset only."""

[[metric]]
name = "narrative_volume"
table = "narratives_v"
kind = "count"
description = "Number of published narratives."
